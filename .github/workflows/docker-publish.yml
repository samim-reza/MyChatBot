name: Build and publish Docker image

# GitHub builds the Docker image (Next.js + FastAPI). This cPanel host cannot
# run Docker, so a follow-up job copies the built static site out of the image
# and uploads it over SFTP. The server never compiles anything.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mychatbot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cpanel:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract static site from image
        run: |
          docker pull "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          cid=$(docker create "${{ env.IMAGE_NAME }}:${{ github.sha }}")
          docker cp "$cid":/app/portfolio/out ./site
          docker rm "$cid"
          test -f site/index.html
          ls -la site

      - name: Upload to cPanel over SFTP
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$CPANEL_HOST" >> "$HOME/.ssh/known_hosts"
          cd site
          sftp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -b - "$CPANEL_USERNAME@$CPANEL_HOST" <<'EOF'
          cd /home/banglabo/samimreza.me
          put -r *
          put .htaccess
          bye
          EOF
